name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/
      - name: Parity fixtures are current
        run: |
          node python/tests/fixtures/make_fixtures.js
          git diff --exit-code -- python/tests/fixtures/irrigation_cases.json

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: python/src
      - run: python -m py_compile apps/streamlit/streamlit_app.py
